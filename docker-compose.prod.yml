name: ciaf-web

services:
  db:
    image: mysql:8.0
    container_name: ciaf-web-mysql-db
    restart: always
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --innodb-strict-mode=0
    environment:
      MYSQL_ROOT_PASSWORD: gr007879   # o codigo (AuthController) usa esta senha fixa
      MYSQL_DATABASE: ciaf_id
      TZ: America/Sao_Paulo
    # O nginx da VPS (80/443) faz o HTTPS e encaminha para estas portas locais. O MySQL (3306) NAO e publicado.
    ports:
      - "127.0.0.1:18081:8081"   # backend (compartilha a rede deste container)
      - "127.0.0.1:3306:3306"    # MySQL (so dentro da VPS / tunel SSH; nao exposto na internet)
    volumes:
      - ciaf-mysql:/var/lib/mysql
      - ./my_sqls/create_dbs.sql:/docker-entrypoint-initdb.d/01-create_dbs.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pgr007879"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: .
    container_name: ciaf-web-backend
    restart: always
    network_mode: "service:db"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/ciaf_id?useTimezone=true&serverTimezone=America/Sao_Paulo
      SPRING_DATASOURCE_PASSWORD: gr007879
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?defina JWT_SIGNING_KEY no .env}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:?defina MAIL_PASSWORD no .env}
      APPLICATION_DISCO_RAIZ: /data/ciaf/
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-}
      JAVA_TOOL_OPTIONS: -Xmx768m
    volumes:
      - ciaf-files:/data/ciaf

  seed:
    image: mysql:8.0
    container_name: ciaf-web-seed
    restart: "no"
    depends_on:
      - backend
    command:
      - sh
      - -c
      - |
        until mysql -hdb -uroot -pgr007879 ciaf_id -e 'select 1 from role limit 1' >/dev/null 2>&1; do sleep 3; done
        mysql -hdb -uroot -pgr007879 ciaf_id -e "INSERT IGNORE INTO role(id,name,description) VALUES (1,'USER','Usuario'),(2,'ADMIN','Administrador')"

  frontend:
    build:
      context: ../front_one
      args:
        API_URL: https://${API_DOMAIN:?defina API_DOMAIN no .env}
    container_name: ciaf-web-frontend
    ports:
      - "127.0.0.1:13000:80"
    restart: always

volumes:
  ciaf-mysql:
  ciaf-files:
