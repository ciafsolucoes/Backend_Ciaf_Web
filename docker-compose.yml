name: ciaf-web

services:
  db:
    image: mysql:8.0
    container_name: ciaf-web-mysql-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --innodb-strict-mode=0
    environment:
      MYSQL_ROOT_PASSWORD: gr007879
      MYSQL_DATABASE: ciaf_id
      TZ: America/Sao_Paulo
    ports:
      - "3306:3306"   # backend compartilha esta rede
      - "8081:8081"   # porta do backend (publicada via db)
    volumes:
      - ciaf-mysql:/var/lib/mysql
      - ./my_sqls/create_dbs.sql:/docker-entrypoint-initdb.d/01-create_dbs.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pgr007879"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: .
    container_name: ciaf-web-backend
    restart: unless-stopped
    # Compartilha a rede do db: o codigo usa jdbc:mysql://localhost:3306 fixo (AuthController)
    network_mode: "service:db"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/ciaf_id?useTimezone=true&serverTimezone=America/Sao_Paulo
      APPLICATION_DISCO_RAIZ: /data/ciaf/
    volumes:
      - ciaf-files:/data/ciaf

  # Cria os papeis padrao (USER/ADMIN) assim que o backend criar a tabela role
  seed:
    image: mysql:8.0
    container_name: ciaf-web-seed
    restart: "no"
    depends_on:
      - backend
    command:
      - sh
      - -c
      - |
        until mysql -hdb -uroot -pgr007879 ciaf_id -e 'select 1 from role limit 1' >/dev/null 2>&1; do sleep 3; done
        mysql -hdb -uroot -pgr007879 ciaf_id -e "INSERT IGNORE INTO role(id,name,description) VALUES (1,'USER','Usuario'),(2,'ADMIN','Administrador')"

  frontend:
    build:
      context: ../front_one
      args:
        API_URL: http://localhost:8081
    container_name: ciaf-web-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  ciaf-mysql:
  ciaf-files:
