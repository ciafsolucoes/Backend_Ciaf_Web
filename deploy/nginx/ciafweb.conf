# Ciaf Web no nginx da VPS. Troque SEU_SITE e SUA_API pelos dominios (mesmos do .env: WEB_DOMAIN e API_DOMAIN).
# Na VPS: cp deploy/nginx/ciafweb.conf /etc/nginx/conf.d/ && nginx -t && systemctl reload nginx
# HTTPS: certbot --nginx -d SEU_SITE -d SUA_API --redirect   (so depois que o DNS apontar para a VPS)

server {
    listen 80;
    listen [::]:80;
    server_name SEU_SITE;
    charset utf-8;

    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name SUA_API;
    charset utf-8;
    client_max_body_size 215m;   # upload de certificados/arquivos (limite do backend: 215MB)

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
